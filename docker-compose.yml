services:
  # ---------------------------------------------------------------------------
  # Database: PostgreSQL 16 with pgvector pre-installed
  # ---------------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: finsight-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finsight_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finsight_secret}
      POSTGRES_DB: ${POSTGRES_DB:-finsight_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finsight_user} -d ${POSTGRES_DB:-finsight_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Cache & Message Broker: Redis 7
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: finsight-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Backend: FastAPI Python Service
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: finsight-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://finsight_user:finsight_secret@db:5432/finsight_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - SECRET_KEY=change-this-to-a-super-secret-32-byte-hex-key-in-production
      - FIELD_ENCRYPTION_KEY=v1n78_qZ8X0A8dI3k2aBcDeFgHiJkLmNoPqRsTuVwXy=
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/workspace/backend
      - ./tests:/workspace/tests
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Frontend: Next.js 16 Web Application
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finsight-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
